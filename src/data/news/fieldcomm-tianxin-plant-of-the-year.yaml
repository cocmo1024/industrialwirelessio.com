slug: fieldcomm-tianxin-plant-of-the-year
headline: "FieldComm Group names Tianxin Pharmaceutical its 2026 Plant of the Year"
date: 2026-11-03
sourceName: FieldComm Group — press release
sourceUrl: https://www.fieldcommgroup.org/pressrelease/tianxin-pharmaceutical-modernizes-hart-ip-over-ethernet-apl
summary: "Tianxin Pharmaceutical's modernization in Leping, Jiangxi Province, runs HART-IP over Ethernet-APL across more than 40,000 signal points in 15 main production workshops, including over 12,000 Ethernet-APL intelligent instruments. FieldComm Group credits the project with approximately 400 km less cabling and 80% less cable-tray space, faster commissioning, and intrinsically safe spur wiring — while preserving the HART knowledge, tools and workflows the plant already had. SUPCON served as DCS provider and supplied about 60% of the intelligent field instruments."
editorsNote: "A wired Ethernet-APL project taking the HART ecosystem's top award is a useful calibration point for wireless planning: the field-network contest is increasingly about which IP path reaches the instrument, and hybrid plants will mix both."
tag: Ecosystem
dateChecked: 2026-11-19
