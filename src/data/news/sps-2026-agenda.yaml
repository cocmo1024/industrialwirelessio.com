slug: sps-2026-agenda
headline: "SPS 2026 puts industrial AI and the Cyber Resilience Act at the top of the agenda"
date: 2026-11-05
sourceName: Mesago Messe Frankfurt — organizer press release
sourceUrl: https://corporate.mesago.com/events/en/press/press-releases/press-releases-events/Cybersecurity_and_Industrial_AI.html
summary: "The 35th SPS — Smart Production Solutions runs 24–26 November 2026 in Nuremberg, with around 1,180 exhibitors expected. Organizer Mesago says the program is led by two themes: translating industrial AI into production practice, and implementing the EU Cyber Resilience Act, whose reporting requirements have applied since September 2026 ahead of full application at the end of 2027. A daily 5G-ACIA guided tour walks through industrial 5G deployments from Siemens, Phoenix Contact, Ericsson Enterprise Wireless Solutions, NXP and Fraunhofer IPT."
editorsNote: "The CRA is the item with teeth for wireless device makers: products with digital elements sold in the EU are in scope, the reporting clock is already running, and gateway and module vendors will be answering compliance questions on the show floor."
