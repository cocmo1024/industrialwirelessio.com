notes: "Classification: OleumTech's own datasheet device functionality is 'Wireless Gateway with Ethernet/Serial Connectivity and Data Logging Capabilities' — the DH3 is recorded as a gateway, not a wireless I/O module, and it is also listed by the Phase 2 plan under modules; the manufacturer's classification governs. Band-specific ordering models: WG-0900-DH3, WG-0915-DH3, WG-2400-DH3, WG-0868-DH3. MQTT/Sparkplug B functionality requires firmware v2.0 or later. No enclosure IP rating is stated in the datasheet, so ipRating is left blank."
