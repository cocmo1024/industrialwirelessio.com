notes: "Cluster-boundary judgment (2026-11-14): admitted as a wireless I/O module. The datasheet's device functionality is 'Wireless Transmitter with Analog and Discrete Inputs' — its analog inputs are generic 0-5 Vdc terminals for user-wired external sensors (it supplies sensor power and has no sensing element of its own), the opposite of the rejected Advantech WISE-4210-S231, which sensed internally and had no I/O terminals. The official product page sits under a pressure-gauge/transducer URL, but the datasheet governs: this is a general-purpose analog/discrete wireless transmitter, not a pressure sensor body. Band-specific ordering models: WT-0900-AD1, WT-0915-AD1, WT-2400-AD1, WT-0868-AD1. The -40 °C to +70 °C figure recorded is the Division 1 / Zone 0 ambient rating; the datasheet allows -40 °C to +80 °C for non-hazardous applications."
