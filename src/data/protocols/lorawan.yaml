    note: "Maxima are the repeater-compatible tables of RP002-1.0.4 (EU Table 12, US Table 19); without the repeater constraint, DR4 and above allow up to 250-byte MAC payloads and 242-byte application payloads (Tables 13 and 20). Application payload assumes the optional FOpts field is empty — MAC commands carried in FOpts reduce it."
