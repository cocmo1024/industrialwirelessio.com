slug: wirelesshart
name: WirelessHART
fullName: WirelessHART — the wireless extension of the HART protocol
standardsBody: FieldComm Group
standardDesignation: IEC 62591
coverage: Cornerstone — definition, parameters and gateway sizing
bands:
  - label: 2.4 GHz ISM
    detail: 2.400–2.480 GHz, IEEE 802.15.4, 15 radio channels
    railFreqMhz: 2400
topology: Full mesh — every device can route for others; self-organizing and self-healing
latencyClass: Device update rates from 1 s to 60 min — monitoring and slow control class
powerProfile: Battery-first — power-module life is rated against update rate (example below)
bestFor: Plant-wide process monitoring with battery-powered field instruments
keyParameters:
  - key: standard
    label: Standard
    value: IEC 62591; WirelessHART is the wireless part of HART 7, first released in 2007
    source: IEC 62591 Ed. 1.0 (2010); Phoenix Contact, WirelessHART Technology page
  - key: phy
    label: Radio (PHY)
    value: IEEE 802.15.4 with DSSS, 2.4 GHz ISM band
    source: Emerson Wireless Gateway 1410S PDS 00813-0600-4410 Rev AJ, network specifications
  - key: channels
    label: Channels
    value: 15 radio channels in the 2.4 GHz band, used with time-synchronized channel hopping and blacklisting of bad channels
    source: Emerson 1410S PDS 00813-0600-4410 Rev AJ; Emerson Engineering Guidelines 00809-0100-6129 Rev AB, App. C
  - key: timeslot
    label: TDMA timeslot
    value: 10 ms — every transmission takes place in a 10 ms time slot on one of the 15 channels
    source: Phoenix Contact, WirelessHART Technology page (Time Synchronized Communication)
  - key: security
    label: Security
    value: AES-128 encryption with join, network and session keys — security is part of the protocol, not an add-on
    source: Emerson Engineering Guidelines 00809-0100-6129 Rev AB, §6.14 and definitions
  - key: updateRates
    label: Supported device update rates
    value: 1, 2, 4, 8, 16, 32 seconds, or 1 to 60 minutes (gateway-supported range)
    source: Emerson Wireless Gateway 1410S PDS 00813-0600-4410 Rev AJ, network specifications
  - key: reliability
    label: Data reliability
    value: Greater than 99% — the figure Emerson specifies for the self-organizing network
    source: Emerson Wireless Gateway 1410S PDS 00813-0600-4410 Rev AJ, network specifications
  - key: battery
    label: Battery life (worked example)
    value: 10-year power module life at a 1-minute update rate at reference conditions (21 °C, routing data for three additional devices) — Rosemount 648 wireless temperature transmitter
    source: Emerson Rosemount 648 PDS 00813-0100-4648 Rev HF, power module specification and footnote 3
  - key: application
    label: Application layer
    value: The HART application layer itself — the same commands, device descriptions and tools as wired HART; a WirelessHART device is managed by existing HART asset tools
    source: FieldComm Group, WirelessHART technology page (compatibility with existing HART devices, commands and tools)
  - key: range
    label: Single-hop range
    value: No fixed standard figure — Emerson's design rules are written in multiples of each installation's effective range, which is set by antenna, mounting height and obstructions
    source: Emerson Engineering Guidelines 00809-0100-6129 Rev AB, §6.10.1 design rules
